name: Feed check

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/check_feed.py
      - .github/workflows/feed-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests gtfs-realtime-bindings
      - name: Fetch and summarise live feed
        env:
          OTD_API_KEY: ${{ secrets.OTD_API_KEY }}
          SNAPSHOTS: "8"
          GAP_SECONDS: "20"
        run: python scripts/check_feed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feed-check
          path: feed_check.json
          if-no-files-found: ignore
