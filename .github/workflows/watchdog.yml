name: Watchdog

# Hourly safety net: if no collector run is running or queued, start one.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restart collection if it stopped
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          active=0
          for s in in_progress queued pending waiting requested; do
            n=$(gh run list -R "$REPO" --workflow collect.yml --status "$s" --json databaseId -q 'length')
            active=$((active + n))
          done
          echo "active collector runs: $active"
          if [ "$active" -eq 0 ]; then
            gh workflow run collect.yml --ref main -R "$REPO"
            echo "Collector was not running; started a new run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Collector is running." >> "$GITHUB_STEP_SUMMARY"
          fi
