name: Daily process

# 00:30 IST: merge yesterday's part files, write the daily summary and STATUS.md.

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: IST date to process (YYYY-MM-DD); blank = yesterday
        default: ""

concurrency:
  group: daily-process
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-processing.txt
      - run: pip install --quiet -r requirements-processing.txt
      - name: Process
        env:
          GH_TOKEN: ${{ github.token }}
        run: python processing/daily_process.py ${{ inputs.date }}
      - name: Commit summary
        run: |
          git config user.name "buswise-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily STATUS.md
          git diff --cached --quiet || git commit -m "Daily summary"
          git push
