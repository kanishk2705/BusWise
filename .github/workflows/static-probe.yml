name: Static probe

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_static.py
      - .github/workflows/static-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - run: python scripts/probe_static.py
