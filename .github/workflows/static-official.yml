name: Official static data

on:
  workflow_dispatch:
    inputs:
      name:
        description: Name to give the OTD download form
        required: true
      email:
        description: E-mail to give the OTD download form
        required: true

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests gtfs-realtime-bindings
      - name: Download official static files
        env:
          OTD_NAME: ${{ inputs.name }}
          OTD_EMAIL: ${{ inputs.email }}
        run: python scripts/fetch_static.py gtfs_official
      - name: Compare official static with live
        env:
          OTD_API_KEY: ${{ secrets.OTD_API_KEY }}
        run: python scripts/compare_static_live.py gtfs_official
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gtfs-official
          path: gtfs_official
          if-no-files-found: ignore
