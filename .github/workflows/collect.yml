name: Collect

# One collector run lasts about 5 h 40 min (GitHub's job limit is 6 h).
# Each run queues its successor as its first step; the concurrency group holds
# the successor until the current run ends, so collection continues even after
# a crash. The Watchdog workflow is an extra safety net. Only one collector
# runs at a time.

on:
  workflow_dispatch:
    inputs:
      run_seconds:
        description: How long to collect (seconds)
        default: "20400"
      flush_minutes:
        description: Minutes between part-file uploads
        default: "30"
      chain:
        description: Start the next run when this one ends
        default: "true"

concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      # Queue the successor now. Thanks to the concurrency group it waits until
      # this run ends for ANY reason (finish, crash, timeout), then starts at once.
      # Skipped if the last 3 runs all failed, to avoid a fast failure loop.
      - name: Queue the next run
        if: (inputs.chain || 'true') == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          fails=$(gh run list -R "$REPO" --workflow collect.yml --status completed -L 3 --json conclusion -q '[.[] | select(.conclusion=="failure")] | length')
          if [ "$fails" -ge 3 ]; then
            echo "Last 3 runs failed; not queueing another." >> "$GITHUB_STEP_SUMMARY"
          else
            gh workflow run collect.yml --ref main -R "$REPO"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collector.txt
      - run: pip install --quiet -r requirements-collector.txt
      - name: Collect live positions
        env:
          OTD_API_KEY: ${{ secrets.OTD_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          RUN_SECONDS: ${{ inputs.run_seconds || '20400' }}
          FLUSH_MINUTES: ${{ inputs.flush_minutes || '30' }}
          RUN_TAG: ${{ github.run_id }}
          UPLOAD: "1"
        run: python collector/collect.py
      - name: Keep any files that failed to upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leftover-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14
