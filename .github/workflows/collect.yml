name: Collect

# One collector run lasts about 5 h 40 min (GitHub's job limit is 6 h).
# At the end it starts the next run itself; the Watchdog workflow restarts
# collection if the chain ever breaks. The concurrency group guarantees that
# only one collector runs at a time.

on:
  workflow_dispatch:
    inputs:
      run_seconds:
        description: How long to collect (seconds)
        default: "20400"
      flush_minutes:
        description: Minutes between part-file uploads
        default: "30"
      chain:
        description: Start the next run when this one ends
        default: "true"

concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collector.txt
      - run: pip install --quiet -r requirements-collector.txt
      - name: Collect live positions
        env:
          OTD_API_KEY: ${{ secrets.OTD_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          RUN_SECONDS: ${{ inputs.run_seconds || '20400' }}
          FLUSH_MINUTES: ${{ inputs.flush_minutes || '30' }}
          RUN_TAG: ${{ github.run_id }}
          UPLOAD: "1"
        run: python collector/collect.py
      - name: Keep any files that failed to upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leftover-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14
      - name: Start the next run
        if: always() && (inputs.chain || 'true') == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref main -R ${{ github.repository }}
